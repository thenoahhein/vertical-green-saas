name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_DB: sitesense, POSTGRES_USER: sitesense, POSTGRES_PASSWORD: sitesense}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitesense -d sitesense"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: latest}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --extra dev
      - uses: actions/cache@v4
        with:
          path: .venv/lib/python3.12/site-packages/whitebox/WBT
          key: whitebox-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Warm WhiteboxTools
        run: |
          WBT_DIR=".venv/lib/python3.12/site-packages/whitebox/WBT"
          WBT_BINARY="$WBT_DIR/whitebox_tools"
          if [ ! -x "$WBT_BINARY" ]; then
            rm -rf "$WBT_DIR"
            uv run python -c "from whitebox.whitebox_tools import download_wbt; download_wbt(verbose=False)"
          fi
          test -x "$WBT_BINARY"
      - run: uv run ruff check apps/api apps/worker seed.py
      - run: uv run mypy apps/api/src apps/worker/src
      - run: uv run pytest apps/api/tests
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
