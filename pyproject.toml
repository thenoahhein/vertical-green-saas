[project]
name = "sitesense"
version = "0.1.0"
description = "Regenerative-land contractor site analysis platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "geopandas>=1.0,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<25",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/sitesense", "apps/worker/src/sitesense_worker"]
